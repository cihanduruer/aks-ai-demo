name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          # Common deps shared by tests (db, metrics, logging) come from api requirements;
          # rl/forecast skip torch (heavy, not needed for smoke tests).
          pip install -r src/api/requirements.txt
          pip install gymnasium numpy pytest ruff

      - name: Ruff
        run: ruff check src tests cli

      - name: Pytest (smoke)
        env:
          PYTHONPATH: src
        run: pytest -q tests

  web:
    name: Web lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint --if-present
      - run: npm run build

  helm:
    name: Helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - run: helm lint deploy/helm/aks-ai-demo
      - run: helm template aks-ai-demo deploy/helm/aks-ai-demo --debug > /dev/null
