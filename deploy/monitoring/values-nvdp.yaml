# nvidia-device-plugin
# Time-slicing disabled: each pod gets the full A100.

nodeSelector:
  workload: gpu-recon

tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule

# No sharing — one pod per physical GPU.
config:
  map:
    default: |-
      version: v1
      flags:
        migStrategy: none
